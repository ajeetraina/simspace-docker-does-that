<svg viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A developer at a desk building, containerising and shipping software">
  <!-- thought bubble: build, containerise, ship -->
  <circle cx="300" cy="150" r="9" fill="#f4f6fb"/>
  <circle cx="286" cy="172" r="6" fill="#f4f6fb"/>
  <rect x="238" y="34" width="196" height="86" rx="16" fill="#f4f6fb"/>
  <!-- wrench (build) -->
  <g transform="translate(262,62) scale(1.1)" fill="#2496ED">
    <path d="M20 2a12 12 0 0 0-14 15l-15 15 6 6 15-15A12 12 0 0 0 22 4l-6 6-4-1-1-4z"/>
  </g>
  <!-- container box (containerise) -->
  <g fill="#0b1f4e">
    <rect x="316" y="54" width="42" height="30" rx="3"/>
    <rect x="320" y="58" width="10" height="22" fill="#f4f6fb"/>
    <rect x="333" y="58" width="10" height="22" fill="#f4f6fb"/>
    <rect x="346" y="58" width="8" height="22" fill="#f4f6fb"/>
  </g>
  <!-- ship / up arrow -->
  <g transform="translate(384,50)">
    <circle cx="18" cy="18" r="20" fill="#f5c518"/>
    <path d="M18 8 l10 12 h-6 v10 h-8 v-10 h-6 z" fill="#0b1f4e"/>
  </g>

  <!-- desk -->
  <rect x="20" y="316" width="480" height="16" rx="8" fill="#22304f"/>

  <!-- monitor -->
  <rect x="46" y="150" width="250" height="150" rx="12" fill="#0e1830" stroke="#2496ED" stroke-width="3"/>
  <rect x="158" y="300" width="26" height="14" fill="#1c2740"/>
  <rect x="128" y="312" width="86" height="9" rx="4.5" fill="#2b3a5e"/>
  <!-- code lines -->
  <rect x="66" y="170" width="78" height="9" rx="4.5" fill="#6b7fff"/>
  <rect x="66" y="188" width="128" height="9" rx="4.5" fill="#3a4a72"/>
  <rect x="66" y="206" width="98" height="9" rx="4.5" fill="#4ade80"/>
  <rect x="66" y="224" width="150" height="9" rx="4.5" fill="#3a4a72"/>
  <rect x="66" y="242" width="66" height="9" rx="4.5" fill="#f5c518"/>
  <!-- docker container squares on screen -->
  <g fill="#2496ED">
    <rect x="222" y="196" width="16" height="16" rx="2"/>
    <rect x="242" y="196" width="16" height="16" rx="2"/>
    <rect x="242" y="178" width="16" height="16" rx="2"/>
    <rect x="262" y="196" width="16" height="16" rx="2"/>
  </g>

  <!-- developer (side view, looking at screen) -->
  <!-- torso -->
  <path d="M356 316 q0 -78 52 -78 q52 0 52 78 z" fill="#2496ED"/>
  <!-- head -->
  <circle cx="404" cy="212" r="34" fill="#f0c9a4"/>
  <!-- hair -->
  <path d="M372 208 a32 32 0 0 1 64 -2 q-6 -14 -22 -15 q-8 -8 -20 -3 q-16 4 -22 20z" fill="#39281d"/>
  <!-- eye + smile (looking left toward the screen) -->
  <circle cx="386" cy="210" r="3.4" fill="#2a2118"/>
  <path d="M378 224 q8 7 16 1" stroke="#b07a4e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- arm reaching to keyboard -->
  <path d="M360 288 q-46 6 -150 28" stroke="#1f7fd0" stroke-width="16" fill="none" stroke-linecap="round"/>
</svg>
