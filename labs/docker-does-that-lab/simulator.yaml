version: "2.0"

metadata:
  id: docker-does-that-lab
  title: "Docker does that?! — Hands-on"
  summary: "Five Docker capabilities on one product-catalog app."

# In-memory state. Scenarios read it in `when.state` and write it in `then.state`.
state:
  containerised: false   # Gordon has scaffolded the files and built the image
  hardened: false

settings:
  pace:
    pull: 900     # simulated layer / image download
    boot: 700     # simulated microVM boot

defaults:
  unmatched:
    stderr: ["Error: that command isn't part of this lab yet."]
    exit: 1

scenarios:
  # ── Page 1 · Gordon ────────────────────────────────────────────────────────
  # `docker ai "<prompt>"` — Gordon inspects the repo and scaffolds the stack.
  - id: gordon-containerize
    completes: containerize-with-gordon
    when:
      command: [docker, ai]
      args:
        0: { any: true }
    then:
      state: { containerised: true }
      # Gordon doesn't just describe the files — it writes them. `cat`/`tree`
      # reflect these immediately, so learners can inspect the result.
      files:
        - create: Dockerfile
          content: |
            # Generated by Gordon — multi-stage, non-root, health-checked.
            FROM node:20-alpine AS build
            WORKDIR /app
            COPY package*.json ./
            RUN npm ci --omit=dev

            FROM node:20-alpine
            WORKDIR /app
            COPY --from=build /app/node_modules ./node_modules
            COPY --chown=node:node . .
            USER node
            HEALTHCHECK CMD wget -qO- http://localhost:3000/products || exit 1
            CMD ["node", "server.js"]
        - create: .dockerignore
          content: |
            node_modules
            npm-debug.log
            .git
            *_test.go
        - create: compose.yaml
          content: |
            # Generated by Gordon — the whole dev stack in one file.
            services:
              app:
                build: .
                ports: ["3000:3000"]
                environment:
                  DATABASE_URL: postgres://shop:shop@db:5432/shop
                depends_on: [db, kafka]
              db:
                image: postgres:17-alpine
                environment:
                  POSTGRES_USER: shop
                  POSTGRES_PASSWORD: shop
                  POSTGRES_DB: shop
              kafka:
                image: apache/kafka:3.7.0
              s3:
                image: localstack/localstack   # S3 in dev
      output:
        - { text: "Gordon is analyzing your project…", delay: short }
        - "Detected: Node.js service + PostgreSQL, Kafka, and S3 dependencies."
        - ""
        - "Your product catalog app is now containerized. I created three files:"
        - "  1. .dockerignore  — excludes node_modules, tests, .git"
        - "  2. Dockerfile     — multi-stage, Node 20 Alpine, non-root, healthcheck (~270MB)"
        - "  3. compose.yaml   — app + postgres + kafka + localstack (S3) + mock inventory"
        - ""
        - "Run `docker compose up` to bring the whole stack up."

  # See what Gordon wrote — the generated files now sit alongside the source.
  - id: gordon-tree
    when:
      command: [tree]
      state: { containerised: true }
    then:
      output:
        - "product-catalog"
        - "├── .dockerignore   ← new"
        - "├── Dockerfile      ← new"
        - "├── compose.yaml    ← new"
        - "├── README.md"
        - "├── package.json"
        - "├── server.js"
        - "└── orders_test.go"

  # Before Gordon runs — source only, nothing to ship it with.
  - id: tree-source
    when:
      command: [tree]
    then:
      output:
        - "product-catalog"
        - "├── README.md"
        - "├── package.json"
        - "├── server.js"
        - "└── orders_test.go"
        - ""
        - "0 directories, 4 files      ← no Dockerfile, no Compose. Source only."

  # The result of containerization: Gordon's compose.yaml brings the whole stack
  # up — the app image builds, its dependencies start, and the service listens.
  - id: compose-up
    completes: run-the-stack
    when:
      command: [docker, compose, up]
      state: { containerised: true }
    then:
      output:
        - { text: "=> [app internal] building from Dockerfile", delay: short }
        - { text: "=> => naming to product-catalog:latest  (multi-stage · non-root · ~270MB)", delay: pull }
        - { text: "🐳 Network product-catalog_default   Created", delay: short }
        - { text: "🐳 Container product-catalog-db-1     Started", delay: short }
        - { text: "🐳 Container product-catalog-kafka-1  Started", delay: short }
        - { text: "🐳 Container product-catalog-s3-1     Started", delay: short }
        - { text: "🐳 Container product-catalog-app-1    Started", delay: short }
        - ""
        - "app-1  | Product Catalog listening on :3000"
        - "app-1  | healthcheck: OK"

  # Before Gordon has scaffolded anything, there's no compose.yaml to run.
  - id: compose-up-empty
    when:
      command: [docker, compose, up]
    then:
      stderr:
        - "no configuration file provided: not found — ask Gordon to containerize the app first."
      exit: 1

  # Prove it really works: the containerized service answers on :3000.
  - id: curl-products
    when:
      command: [curl]
      state: { containerised: true }
    then:
      output:
        - '[{"id":1,"name":"Aeron Chair","price":1395},'
        - ' {"id":2,"name":"Standing Desk","price":650}]'

  # ── Page 2 · Testcontainers ────────────────────────────────────────────────
  # `go test ./...` — a real Postgres spins up per run, then is torn down.
  - id: run-tests
    completes: run-tests
    when:
      command: [go, test]
    then:
      output:
        - { text: "🐳 Pulling postgres:17-alpine …", delay: pull }
        - { text: "🐳 Container postgres:17-alpine  Started", delay: short }
        - "=== RUN   TestProducts"
        - "    connected to a real Postgres — no mocks"
        - "--- PASS: TestProducts (1.84s)"
        - { text: "🐳 Container postgres:17-alpine  Terminated", delay: short }
        - "PASS"
        - "ok      product-catalog/orders   2.11s"

  # ── Page 3 · Docker Scout ──────────────────────────────────────────────────
  # After the hardened swap, the SAME command shows the collapsed CVE count.
  # Listed first so it takes precedence over the generic quickview below.
  - id: scout-quickview-hardened
    when:
      command: [docker, scout, quickview]
      state: { hardened: true }
    then:
      output:
        - "  Target     my-app:latest  (dhi.io/node:20)"
        - "  Critical  0   High  0   Medium  0   Low  1"
        - "  Policy: PASSED ✓"

  - id: scout-quickview
    completes: scout-quickview
    when:
      command: [docker, scout, quickview]
    then:
      output:
        - "  Target     my-app:latest  (node:20)"
        - "  Critical  0   High  2   Medium  14   Low  31"
        - "  Policy: FAILED — 2 high, inherited from the base image."

  - id: scout-cves
    when:
      command: [docker, scout, cves]
    then:
      output:
        - "  Analyzing image my-app:latest"
        - "  47 vulnerabilities found in 12 packages (SBOM attached)"
        - "  ↳ CVE-2024-xxxx  HIGH   openssl  3.0.11"

  - id: scout-recommendations
    when:
      command: [docker, scout, recommendations]
    then:
      output:
        - "  ↳ base image node:20  →  node:20-slim   (removes 41 CVEs)"
        - "  ↳ consider a hardened base: dhi.io/node:20  (near-zero CVEs)"

  - id: scout-policy
    completes: scout-policy
    when:
      command: [docker, scout, policy]
    then:
      output:
        - "  Evaluating my-app:latest against org policy…"
        - "  ✗ No high or critical vulnerabilities   FAILED (2 high)"
        - "  ✓ Supply chain attestations present     PASSED"
        - ""
        - "  Policy FAILED — switch to a hardened base to pass."

  # ── Page 4 · Hardened Images ───────────────────────────────────────────────
  # The one-line change: rewrite `FROM node:20` → `FROM dhi.io/node:20`.
  # The command OVERWRITES the Dockerfile, so `cat Dockerfile` reflects the swap.
  - id: harden-dockerfile
    completes: harden-dockerfile
    when:
      command: [sed]
    then:
      state: { hardened: true }
      files:
        - create: Dockerfile
          content: |
            # after — hardened base: patched + minimal + signed
            FROM dhi.io/node:20

            WORKDIR /app
            COPY --chown=app:app . .
            RUN npm ci --omit=dev
            USER app
            CMD ["node", "server.js"]
      output:
        - "Dockerfile updated:  FROM node:20  →  FROM dhi.io/node:20"

  # Build AFTER the swap — uses the hardened base. Listed before the plain build
  # so it takes precedence once `hardened` is set.
  - id: build-hardened
    completes: build-hardened
    when:
      command: [docker, build]
      state: { hardened: true }
    then:
      output:
        - { text: "=> [internal] load build definition from Dockerfile", delay: short }
        - { text: "=> FROM dhi.io/node:20  (patched · minimal · signed)", delay: pull }
        - "=> [1/3] WORKDIR /app"
        - "=> [2/3] COPY --chown=app:app . ."
        - "=> [3/3] RUN npm ci --omit=dev"
        - "=> exporting to image"
        - "=> => naming to my-app:latest"
        - ""
        - "Built my-app:latest on a hardened base — SBOM + SLSA L3 provenance attached."

  # Build BEFORE the swap — still on the full node:20 base.
  - id: build-plain
    when:
      command: [docker, build]
    then:
      output:
        - { text: "=> [internal] load build definition from Dockerfile", delay: short }
        - { text: "=> FROM node:20  (full base — you own the patching)", delay: pull }
        - "=> [1/3] WORKDIR /app"
        - "=> [2/3] COPY --chown=app:app . ."
        - "=> [3/3] RUN npm ci --omit=dev"
        - "=> exporting to image"
        - "=> => naming to my-app:latest"
        - ""
        - "Built my-app:latest — still on node:20. Swap to a hardened base to drop the CVEs."

  # ── Page 5 · Sandboxes ─────────────────────────────────────────────────────
  - id: sbx-run
    completes: run-sandbox
    when:
      command: [sbx, run]
      args:
        0: { any: true }
    then:
      output:
        - { text: "Booting microVM (own kernel · own dockerd)…", delay: boot }
        - "  ✔ microVM booted"
        - "  ✔ network policy: deny-by-default"
        - "  ✔ secrets: OS keychain → proxy (nothing written to VM)"
        - ""
        - "agent '{{ args.0 }}' is live. It can edit your code — and nothing else."
