# Seed the virtual filesystem — the Product Catalog sample app Max is working on.
# Built-in `ls`/`cat` and :filelink reflect these immediately.
files:
  README.md: |
    # Product Catalog

    A Node.js service backing an online store's product catalog.

    Dependencies:
      - PostgreSQL  — product data
      - AWS S3      — product images (LocalStack in dev)
      - Kafka       — product-update events
      - Inventory   — downstream service (mocked in dev)

    Max's task this morning: containerize it, following best practices.
  package.json: |
    {
      "name": "product-catalog",
      "version": "1.0.0",
      "main": "server.js",
      "scripts": {
        "start": "node server.js",
        "test": "go test ./..."
      },
      "dependencies": {
        "express": "^4.19.2",
        "pg": "^8.12.0"
      }
    }
  server.js: |
    const express = require("express");
    const { Pool } = require("pg");

    const app = express();
    const pool = new Pool({ connectionString: process.env.DATABASE_URL });

    app.get("/products", async (_req, res) => {
      const { rows } = await pool.query("SELECT * FROM products");
      res.json(rows);
    });

    app.listen(3000, () => console.log("Product Catalog listening on :3000"));
  orders_test.go: |
    func TestProducts(t *testing.T) {
        ctx := context.Background()

        // a real Postgres, started just for this test
        pg, err := postgres.Run(ctx, "postgres:17-alpine",
            postgres.WithDatabase("shop"),
            postgres.WithUsername("test"),
            postgres.WithPassword("test"),
        )
        require.NoError(t, err)
        defer pg.Terminate(ctx)   // gone when the test ends

        dsn, _ := pg.ConnectionString(ctx, "sslmode=disable")
        // ...run real queries against a real engine...
    }

